41,100,41,105,41,100,42,105,42,106,42,100,43,101,43,106,43,107,43,101,44,102,44,107,44,102,45,103,45,108,45,103,46,108,46,109,46,99,47,100,47,101,47,102,47,103,47,109,47,110,47,99,48,100,48,101,48,102,48,103,48,110,48,111,48,99,49,100,49,110,49,111,49,99,50,100,50,111,50,100,52,101,52,111,52,101,53,102,53,111,53,112,53,113,53,101,54,102,54,112,54,113,54,115,54,101,55,113,55,115,55,116,55,100,56,109,56,110,56,111,56,113,56,115,56,116,56,99,57,109,57,110,57,111,57,112,57,113,57,115,57,116,57,117,57,98,58,99,58,108,58,109,58,112,58,113,58,115,58,116,58,117,58,98,59,107,59,108,59,113,59,115,59,116,59,97,60,106,60,107,60,95,61,97,61,105,61,106,61,95,62,96,62,97,62,104,62,105,62,95,63,96,63,103,63,104,63,95,64,96,64,103,64,95,65,102,65,103,65,102,66,101,67,99,68,100,68,101,68,96,69,97,69,98,69,99,69,95,70,96,70,97,70,95,71".split(",").map(Number);
  const DIRX=-0.707, DIRY=-0.707;

  // feste Einstellungen (ohne Beat)
  const cfg = {"dot":"#B4C1CB","bg":"#FFFFFF","size":7.9,"alpha":0.5,"scale":true,
    "wander":0.85,"unruhe":0.21,"blenden":0.6,"easing":0.75,
    "force":1,"radius":502,"delay":0.35,"trail":0,"zoom":1.08,"gridmul":0.97};

  const canvas=document.getElementById("c");
  const ctx=canvas.getContext("2d");
  let W=0,H=0,DPR=1,scale=1,offX=0,offY=0,GI_MIN,GJ_MIN,SI,SJ,cx0=0,cy0=0;
  function hexToRgb(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
  const dotRGB=hexToRgb(cfg.dot);
  const dotCol=dotRGB.join(","); // einmalig berechnet -- dotRGB aendert sich nie, war vorher jeden Frame neu gejoint
  document.body.style.background=cfg.bg;

  const N=CELLS.length/2;
  const B=new Array(N);
  let CGI=0,CGJ=0;
  for(let i=0;i<N;i++){ CGI+=CELLS[i*2]; CGJ+=CELLS[i*2+1]; }
  CGI/=N; CGJ/=N;
  for(let i=0;i<N;i++){
    const gi=CELLS[i*2],gj=CELLS[i*2+1];
    B[i]={ hi:gi,hj:gj, phx:Math.random()-0.5, phy:Math.random()-0.5,
           ci:gi,cj:gj, vis:Math.random(), st:(Math.random()<0.5?1:2),
           pdx:0,pdy:0, uoi:0,uoj:0, prox:0 };
  }
  let GX=0,GY=0;

  function mx(gi){const xs=cx0+(gi-CGI)*GRID.g*cfg.gridmul*scale; return W/2+(xs-W/2)*cfg.zoom;}
  function my(gj){const ys=cy0+(gj-CGJ)*GRID.g*cfg.gridmul*scale; return H/2+(ys-H/2)*cfg.zoom;}
  function toGi(px){const xs=(px-W/2)/cfg.zoom+W/2; return CGI+(xs-cx0)/(GRID.g*cfg.gridmul*scale);}
  function toGj(py){const ys=(py-H/2)/cfg.zoom+H/2; return CGJ+(ys-cy0)/(GRID.g*cfg.gridmul*scale);}
  function layout(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=innerWidth;H=innerHeight;
    canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
    canvas.style.width=W+"px";canvas.style.height=H+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
    scale=Math.max(W/SRC_W,H/SRC_H)*1.04;
    offX=(W-SRC_W*scale)/2; offY=(H-SRC_H*scale)/2;
    cx0=offX+(GRID.ox+CGI*GRID.g)*scale;
    cy0=offY+(GRID.oy+CGJ*GRID.g)*scale;
  }
  function wrapI(v,lo,span){let r=(v-lo)%span;if(r<0)r+=span;return lo+r;}
  function okey(gi,gj){return (gi+1024)*8192+(gj+1024);}

  const M={x:-1e4,y:-1e4,active:false};
  function pt(e){const t=e.touches?e.touches[0]:e;if(!t)return;M.x=t.clientX;M.y=t.clientY;M.active=true;}
  addEventListener("pointermove",pt,{passive:true});
  addEventListener("pointerdown",pt,{passive:true});
  addEventListener("pointerleave",()=>{M.active=false;M.x=M.y=-1e4;});
  addEventListener("blur",()=>{M.active=false;M.x=M.y=-1e4;});

  function easeMix(v){const s=v*v*(3-2*v);return v+(s-v)*cfg.easing;}

  // ---- Simulation (ohne Zeichnen) ----
  function simulate(){
    { const mg=2,i0=Math.floor(toGi(0))-mg,i1=Math.ceil(toGi(W))+mg,j0=Math.floor(toGj(0))-mg,j1=Math.ceil(toGj(H))+mg;
      GI_MIN=i0;GJ_MIN=j0;SI=i1-i0;SJ=j1-j0; }
    const sp=cfg.wander*0.10;
    GX+=DIRX*sp; GY+=DIRY*sp;
    const fade=0.02+cfg.blenden*0.10;
    const R=cfg.radius, R2=R*R;
    const delayRate=1-cfg.delay*0.92;
    const unruheNow=cfg.unruhe;
    for(let i=0;i<N;i++){
      const p=B[i];
      if(Math.random()<unruheNow*0.014){ p.uoi=(Math.random()*3|0)-1; p.uoj=(Math.random()*3|0)-1; }
      else if(Math.random()<0.01){ p.uoi=0; p.uoj=0; }
      let tpx=0,tpy=0; p.prox=0;
      if(M.active){
        const x=mx(p.ci),y=my(p.cj),dx=x-M.x,dy=y-M.y,d2=dx*dx+dy*dy;
        if(d2<R2){const d=Math.sqrt(d2)||1,fall=1-d/R;p.prox=fall;
          const amt=cfg.force*6*fall*fall; tpx=(dx/d)*amt; tpy=(dy/d)*amt;}
      }
      p.pdx+=(tpx-p.pdx)*delayRate; p.pdy+=(tpy-p.pdy)*delayRate;
      const ti=wrapI(p.hi+Math.round(GX+p.phx+p.pdx+p.uoi),GI_MIN,SI);
      const tj=wrapI(p.hj+Math.round(GY+p.phy+p.pdy+p.uoj),GJ_MIN,SJ);
      if(p.st===0){ if(ti!==p.ci||tj!==p.cj)p.st=1; }
      else if(p.st===1){ p.vis-=fade; if(p.vis<=0){p.vis=0;p.ci=ti;p.cj=tj;p.st=2;} }
      else { p.vis+=fade; if(p.vis>=1){p.vis=1;p.st=0;} }
    }
  }

  // Persistenter Objekt-Pool + wiederverwendetes Array/Set: vorher wurden
  // hier JEDEN Frame 782 neue {gi,gj,a,rad}-Objekte, ein neues Array und
  // ein neues Set erzeugt und sofort wieder verworfen -- das erzeugt bei
  // 60fps spuerbaren Garbage-Collection-Druck (im Web-Inspector-Profiling
  // als kurze 6-7ms-GC-Pausen sichtbar). Gleiche Werte, gleiche
  // Sortierung, gleiche Zeichenreihenfolge wie vorher -- es wird nur
  // Speicher wiederverwendet statt neu alloziert.
  const items=new Array(N);
  for(let i=0;i<N;i++){ items[i]={gi:0,gj:0,a:0,rad:0}; }
  const occ=new Set();

  // ---- Zeichnen ----
  function render(){
    ctx.clearRect(0,0,W,H);
    const drawR=cfg.size*scale*cfg.zoom;
    for(let i=0;i<N;i++){
      const p=B[i];
      let rad=drawR; if(cfg.scale)rad*=1+p.prox*0.20;
      const it=items[i];
      it.gi=p.ci; it.gj=p.cj; it.a=cfg.alpha*easeMix(p.vis); it.rad=rad;
    }
    items.sort((a,b)=>b.a-a.a);
    occ.clear();
    for(const it of items){
      if(it.a<=0.004)continue;
      const k=okey(it.gi,it.gj); if(occ.has(k))continue; occ.add(k);
      ctx.fillStyle="rgba("+dotCol+","+it.a+")";
      ctx.beginPath(); ctx.arc(mx(it.gi),my(it.gj),it.rad,0,6.2832); ctx.fill();
    }
  }

  let opened=false;
  function frame(){ simulate(); render();
    if(!opened){opened=true; canvas.style.opacity="1";}   // sanftes Öffnen
    requestAnimationFrame(frame); }

  addEventListener("resize",layout);
  layout();
  requestAnimationFrame(frame);
})();
