<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EatMe</title>

  <!-- Design-Tokens: Farben, Fonts, Font-Faces — einzige Quelle, siehe tokens-notes.md -->
  <link rel="stylesheet" href="tokens.css" />

  <!-- Globales Layout-Grundgerüst (Hintergrund-Layer, Sektions-Wrapper-Basics) -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Komponenten-CSS: wiederverwendbare Bausteine, siehe ARCHITECTURE.md -->
  <link rel="stylesheet" href="components/eatme-navigation.css" />
  <link rel="stylesheet" href="components/eatme-lyrics.css" />

  <!-- Sektions-CSS: eine Datei pro Sektion, siehe ARCHITECTURE.md -->
  <link rel="stylesheet" href="sections/section-01-stage.css" />
  <link rel="stylesheet" href="sections/section-02-text-01.css" />
  <link rel="stylesheet" href="sections/section-03-images.css" />
  <link rel="stylesheet" href="sections/section-04-text-02.css" />
  <link rel="stylesheet" href="sections/section-05-images-drops.css" />
</head>
<body>

  <!--
    Durchgehender Himmel-Hintergrund über alle Sektionen.
    Verhalten (Verlauf, Textur, evtl. Parallax) wird separat in
    background-and-motion.md spezifiziert und hier per CSS/JS befüllt,
    sobald das geklärt ist. Liegt hinter allen Sektionen (z-index).
  -->
  <div class="page-background" aria-hidden="true"></div>

  <!--
    Wiederkehrende Navigation (Logo, Social-Links, Sound-Toggle später).
    Wird eigener Chat / eigene Komponente, siehe ARCHITECTURE.md
    -> Komponenten: eatme-navigation
  -->
  <header id="site-nav">
    <!-- component: eatme-navigation -->
    <div class="eatme-nav">
      <img class="eatme-nav-logo" id="nav-logo" src="" alt="EatMe" />
      <nav class="eatme-nav-links" id="nav-links" aria-label="Social Links">
        <!-- wird zur Laufzeit aus content.json befüllt, siehe script.js -->
      </nav>
    </div>
  </header>

  <main>
    <!--
      Jede Sektion bekommt ihren eigenen Chat + eigene CSS-Datei unter
      /sections. Platzhalter hier halten nur die Reihenfolge und IDs fest,
      damit background-and-motion.md und spätere Sektions-Chats sich darauf
      beziehen können.
    -->
    <section id="section-01-stage" class="section">
      <div class="stage">
        <img class="stage-bg" src="assets/visuals/backgrounds/cloud-stage-background.jpg" alt="" aria-hidden="true" />
        <iframe class="stage-birds" src="assets/visuals/birds-stage.html" title="" aria-hidden="true" tabindex="-1"></iframe>
      </div>
      <nav class="secondary-nav">
        <a href="mailto:contact@eatmemusic.com" class="text-copy-s">contact@eatmemusic.com</a>
        <button class="sound-toggle text-copy-s" type="button" data-state="off">Sound</button>
      </nav>
    </section>

    <section id="section-02-text-01" class="section">
      <div class="birds-blue-container" aria-hidden="true">
        <img class="bird-blue-lg" src="assets/visuals/birds-blue/bird-blue-lg.svg" alt="" />
        <img class="bird-blue-sm" src="assets/visuals/birds-blue/bird-blue-sm.svg" alt="" />
      </div>
      <div class="text-container">
        <div class="text-01-copy text-copy-l" id="section-02-copy">
          <!-- wird zur Laufzeit aus content.json befüllt, siehe script.js -->
        </div>
      </div>
    </section>

    <section id="section-03-images" class="section">
      <div class="col-image-left">
        <div class="image-container">
          <img class="eatme-image-01" id="section-03-image-01" src="" alt="" />
        </div>
      </div>
      <div class="col-text-image">
        <!--
          Songtext-Modul: komplett klickbar (siehe components/eatme-lyrics.css
          für Styling + verstärkten Blur). href wird zur Laufzeit aus
          content.json (lyrics.song_link) gesetzt, siehe script.js --
          Platzhalter-# hier nur als Fallback, falls content.json mal nicht
          lädt.
        -->
        <a href="#" class="eatme-lyrics-link" id="section-03-lyrics-link" aria-label="Song abspielen">
          <div class="lyrics-lines text-lyrics" id="section-03-lyrics-lines">
            <!-- wird zur Laufzeit aus content.json befüllt, siehe script.js -->
          </div>
          <div class="song-link">
            <svg class="icon-play" viewBox="0 0 9 8" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M0 0L9 4L0 8V0Z" fill="currentColor" />
            </svg>
            <span class="text-copy-xs" id="section-03-song-title"></span>
          </div>
        </a>
        <img class="eatme-image-02" id="section-03-image-02" src="" alt="" />
      </div>
    </section>

    <section id="section-04-text-02" class="section">
      <div class="text-container">
        <div class="text-04-copy text-copy-l" id="section-04-copy">
          <!-- wird zur Laufzeit aus content.json befüllt, siehe script.js -->
        </div>
      </div>
      <!-- Vogel-Silhouetten-Übergang folgt erst ganz am Schluss (siehe
           ARCHITECTURE.md), hier bewusst noch nicht enthalten. -->
    </section>

    <section id="section-05-images-drops" class="section">
      <div class="col-image-left">
        <div class="image-container">
          <img class="eatme-image-03" id="section-05-image-01" src="" alt="" />
        </div>
      </div>
      <div class="col-text-image">
        <!--
          Songtext-Modul: identisch zu section-03 (siehe dort), komplett
          klickbar (siehe components/eatme-lyrics.css für Styling +
          verstärkten Blur). href wird zur Laufzeit aus content.json
          (lyrics.song_link) gesetzt, siehe script.js.
        -->
        <a href="#" class="eatme-lyrics-link" id="section-05-lyrics-link" aria-label="Song abspielen">
          <div class="lyrics-lines text-lyrics" id="section-05-lyrics-lines">
            <!-- wird zur Laufzeit aus content.json befüllt, siehe script.js -->
          </div>
          <div class="song-link">
            <svg class="icon-play" viewBox="0 0 9 8" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M0 0L9 4L0 8V0Z" fill="currentColor" />
            </svg>
            <span class="text-copy-xs" id="section-05-song-title"></span>
          </div>
        </a>
      </div>

      </div>

    <section id="section-06-text-social" class="section">
      <!-- Ankündigungstext + Instagram-Modul -->
    </section>

    <section id="section-07-footer" class="section">
      <!-- Songzeile, Booking-CTA, Kontakt, Footer-Links -->

  </main>

  <!-- Content wird zur Laufzeit aus content.json geladen -->
  <script src="script.js" defer></script>
</body>
</html>
